# Copy to k8s/apm-secret.yaml (gitignored) if you want to change anything, then:
#
#   kubectl --context kind-eshop apply -f k8s/apm-secret.yaml
#   ./scripts/setup.sh   # restarts the services so they re-read the Secret
#
# Two documents. The Node.js services read all three keys from `ecs-eshop`;
# the APM Server Deployment (in kube-system, see k8s/apm-server/) reads the
# token from its own copy. The token is a shared secret between components of
# this demo, not an external credential - the placeholder below is
# self-consistent and works as-is. Change it if you like, but change it in
# BOTH documents or the services will get 401s.
#
# Note: `active` is "true" out of the box, so the services start trying to
# reach the in-cluster APM Server immediately. Until you run
# `./scripts/apm-server.sh apply` they will log connection errors every few
# seconds. That is expected; the storefront itself is unaffected.
apiVersion: v1
kind: Secret
metadata:
  name: apm-credentials
  namespace: ecs-eshop
type: Opaque
stringData:
  active: "true"
  # In-cluster APM Server. Cross-namespace, so the FQDN is required - plain
  # `http://apm-server:8200` does not resolve from ecs-eshop. Plaintext HTTP is
  # fine inside a kind cluster; do not copy this pattern into a real one.
  #
  # To use a managed Elastic Cloud APM endpoint instead, put its URL here and
  # skip ./scripts/apm-server.sh entirely, e.g.
  #   https://<deployment>.apm.<region>.cloud.es.io:443
  server-url: "http://apm-server.kube-system.svc.cluster.local:8200"
  secret-token: "replace-me"
---
apiVersion: v1
kind: Secret
metadata:
  name: apm-credentials
  namespace: kube-system
type: Opaque
stringData:
  # Must match secret-token above.
  secret-token: "replace-me"
