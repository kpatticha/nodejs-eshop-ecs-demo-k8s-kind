# Copy to k8s/common/elasticsearch-secret.yaml (gitignored), fill in real
# values, then:
#
#   ./scripts/agent.sh apply        # Elastic Agent standalone + kube-state-metrics
#   ./scripts/apm-server.sh apply   # APM Server
#
# Both components read this one Secret - it is the single place Elasticsearch
# credentials live in this repo.
#
# The user needs to publish to the agent's data streams and to the APM data
# streams. One role covers both:
#
#   cluster:  ["monitor"]
#   indices:  names ["logs-*-*", "metrics-*-*", "traces-*-*", "synthetics-*-*"]
#             privileges ["auto_configure", "create_doc"]
#             names [".apm-agent-configuration"]
#             privileges ["read"]
#
# The APM data streams (traces-apm*, logs-apm*, metrics-apm*) are covered by
# the "*-*" patterns. `.apm-agent-configuration` is needed because APM Server
# serves central agent config to the Node.js agents and reads it from
# Elasticsearch with these same credentials - without it you get a
# security_exception log line every 30 seconds.
#
# The `kibana_system` user does NOT have these - you will get 403s. Using the
# `elastic` superuser works but hides any privilege mistake, so the list above
# is only exercised if you actually create a scoped role.
#
# To use an API key for the agent instead, see the comment header in
# k8s/elastic-agent/elastic-agent-standalone.yaml for the two lines to swap
# back, and copy the key in the *Beats* format (id:api_key) - the Base64 form
# does not work.
#
# No ssl settings are needed for Elastic Cloud endpoints: they use a publicly
# trusted CA. For a self-signed cluster, set the CA_TRUSTED env var in the
# agent DaemonSet to the root CA's SHA-256 fingerprint, and add
# `ssl.ca_trusted_fingerprint` to the APM Server ConfigMap.
apiVersion: v1
kind: Secret
metadata:
  name: elasticsearch-credentials
  namespace: kube-system
type: Opaque
stringData:
  # Elasticsearch endpoint, e.g. https://<deployment>.es.<region>.gcp.elastic-cloud.com:443
  es-host: "REPLACE"
  username: "elastic"
  password: "REPLACE"
